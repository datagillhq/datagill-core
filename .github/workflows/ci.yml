name: CI

on:
  push:
    branches: [main]
  pull_request:

# Minimal permissions — read-only access to repo contents is sufficient.
permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          # golangci-lint-action manages its own cache — disable setup-go's
          # cache to avoid conflicts.
          cache: false

      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
          args: ./models/... ./repository/... ./cmd/worker/... ./services/search/...

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: Run unit tests
        run: make test-unit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: Build
        run: make build
