services:
  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped

  processing:
    build:
      context: .
      dockerfile: services/processing/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
    restart: unless-stopped

  search:
    build:
      context: .
      dockerfile: services/search/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
    restart: unless-stopped
